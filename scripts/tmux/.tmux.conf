# ========================================
# Tmux Configuration
# ========================================

# Enable mouse support
set -g mouse on

# Enable mouse click to select pane
set -g mouse-select-pane on

# Enable mouse drag to resize pane
set -g mouse-resize-pane on

# Enable mouse click to select window
set -g mouse-select-window on

# Scroll with mouse wheel
set -g terminal-overrides 'xterm*:smcup@:rmcup@'

# ========================================
# Appearance
# ========================================

# Status bar position
set -g status-position bottom

# Status bar colors
set -g status-style bg=black,fg=white

# Active window in status bar
set -g window-status-current-style bg=green,fg=black,bold

# Pane border
set -g pane-border-style fg=white
set -g pane-active-border-style fg=green

# ========================================
# Key bindings
# ========================================

# Reload config with Ctrl+b r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Split panes with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Switch panes with Alt+arrow (no prefix)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Resize panes with Shift+arrow
bind -n S-Left resize-pane -L 5
bind -n S-Right resize-pane -R 5
bind -n S-Up resize-pane -U 5
bind -n S-Down resize-pane -D 5

# Use vim keybindings in copy mode
setw -g mode-keys vi

# ========================================
# General settings
# ========================================

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase history limit
set -g history-limit 10000

# Don't rename windows automatically
set -g allow-rename off

# Faster key repetition
set -s escape-time 0

# 256 colors
set -g default-terminal "screen-256color"
