# Lazygit Configuration
# https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md

# GUI settings
gui:
  # Theme
  theme:
    activeBorderColor:
      - green
      - bold
    inactiveBorderColor:
      - default
    optionsTextColor:
      - blue
    selectedLineBgColor:
      - blue
    selectedRangeBgColor:
      - blue
  # Show file tree
  showFileTree: true
  # Show random tips
  showRandomTip: true
  # Show command log
  showCommandLog: false
  # Show icons (requires Nerd Font)
  nerdFontsVersion: "3"
  # Window size
  screenMode: "normal"
# Git settings
git:
  # Paging settings
  pagers:
    - colorArg: always
      pager: ""
  # Auto fetch
  autoFetch: true
  # Auto stage file
  autoStageResolvedConflicts: true
  # Commit message
  commit:
    signOff: false
# Keybindings (optional customization)
keybinding:
  universal:
    quit: "q"
    quit-alt1: "<c-c>"
    return: "<esc>"
    togglePanel: "<tab>"
    prevItem: "<up>"
    nextItem: "<down>"
    prevItem-alt: "k"
    nextItem-alt: "j"
    prevPage: ","
    nextPage: "."
    gotoTop: "<"
    gotoBottom: ">"
    createPatch: "<c-p>"
    pull: "p"
# OS settings
os:
  edit: "nvim {{filename}}"
  editAtLine: "nvim +{{line}} {{filename}}"
  editAtLineAndWait: "nvim +{{line}} {{filename}}"
  openInTerminal: "bash -c \"nvim {{filename}}\""
  copyToClipboard: "xclip -selection clipboard"
  pasteFromClipboard: "xclip -selection clipboard -o"
# Refs settings
refs:
  branches:
    - "main"
    - "master"
    - "develop"
    - "dev"
# Prompt settings
promptToReturnFromSubprocess: true
