# Alacritty Configuration
# Font: Hack Nerd Font Mono

[font]
size = 12.0

[font.normal]
family = "Hack Nerd Font Mono"
style = "Regular"

[font.bold]
family = "Hack Nerd Font Mono"
style = "Bold"

[font.italic]
family = "Hack Nerd Font Mono"
style = "Italic"

[font.bold_italic]
family = "Hack Nerd Font Mono"
style = "Bold Italic"

# Optional: Enable font ligatures (if supported)
[font.offset]
x = 0
y = 0

[font.glyph_offset]
x = 0
y = 0
