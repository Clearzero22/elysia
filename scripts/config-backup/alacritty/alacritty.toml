# Alacritty Configuration
# Font: Hack Nerd Font Mono
# Theme: Gruvbox Light

[font]
size = 12.0

[font.normal]
family = "Hack Nerd Font Mono"
style = "Regular"

[font.bold]
family = "Hack Nerd Font Mono"
style = "Bold"

[font.italic]
family = "Hack Nerd Font Mono"
style = "Italic"

[font.bold_italic]
family = "Hack Nerd Font Mono"
style = "Bold Italic"

[font.offset]
x = 0
y = 0

[font.glyph_offset]
x = 0
y = 0

# ========================================
# Gruvbox Light Theme
# ========================================
[colors.primary]
background = "#fbf1c7"
foreground = "#3c3836"

[colors.normal]
black = "#fbf1c7"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
magenta = "#b16286"
cyan = "#689d6a"
white = "#3c3836"

[colors.bright]
black = "#928374"
red = "#9d0006"
green = "#79740e"
yellow = "#b57614"
blue = "#076678"
magenta = "#8f3f71"
cyan = "#427b58"
white = "#282828"

[colors.cursor]
text = "#fbf1c7"
cursor = "#3c3836"

[colors.selection]
text = "#3c3836"
background = "#d5c4a1"
